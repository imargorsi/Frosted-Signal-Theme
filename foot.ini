# foot reads [colors-dark] by default (and only falls back to [colors-light]
# when initial-color-theme=light), so a dark theme needs this section alone.
# Plain [colors] still parses but is deprecated and warns once per key.
# The cursor is a key here — [cursor] holds style and blink, not colours.
[colors-dark]
alpha=0.88
background=0B0E20
foreground=DCD4BC

cursor=0B0E20 F6D26C

selection-background=272B5E
selection-foreground=FBFBF4

regular0=0B0E20
regular1=C85234
regular2=8CAE3E
regular3=E6B14A
regular4=6E72C6
regular5=8B67C0
regular6=7FA3DC
regular7=DCD4BC

bright0=6E70A8
bright1=E4703F
bright2=BFD45C
bright3=F6D26C
bright4=8A8EDE
bright5=AC8AE0
bright6=A5C4F0
bright7=FBFBF4
